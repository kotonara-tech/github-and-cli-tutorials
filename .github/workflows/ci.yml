# 教材のチェックを自動で実行する設定です。
# Pull Request を作ったときと、main に push したときに実行されます。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown の書式チェック
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得する
        uses: actions/checkout@v5

      - name: markdownlint を実行する
        run: npx --yes markdownlint-cli2@0.18.1

  shell:
    name: シェルスクリプトと設定ファイルのチェック・テスト
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得する
        uses: actions/checkout@v5

      - name: shellcheck を実行する
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

      - name: todo-cli のテストを実行する
        run: bash samples/todo-cli/tests/test_todo.sh

      - name: 練習用スクリプトのテストを実行する
        run: bash exercises/scripts/tests/test_sandboxes.sh

      - name: Claude Code のフックのテストを実行する
        run: bash samples/claude-harness/tests/test_hooks.sh

      # .vscode/ の JSON は、コメントを書ける形式（JSONC）なので対象外にする（VS Code が編集中にチェックする）
      - name: JSON ファイル（Claude Code の設定など）を検証する
        # ファイル名に空白などが含まれていても正しく渡せるように、-z と xargs -0 を使う
        run: |
          git ls-files -z '*.json' ':!:.vscode/**' ':!:**/.vscode/**' |
            xargs -0 -n 1 sh -c 'python3 -m json.tool "$1" >/dev/null || { echo "JSON の書式が正しくありません: $1"; exit 1; }' sh
